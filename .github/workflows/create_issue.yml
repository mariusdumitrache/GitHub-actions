name: Create Issue
on:
  workflow_call:
    inputs:
      title:
        description: "Issue title"
        required: true
        type: string
        default: "This is the default issue title"
      body:
        description: "Issue body"
        required: true
        type: string
        default: "This is the default boby text of the issue"

jobs:
  create-issue:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Create Issue
        uses: peter-evans/create-issue-from-file@v4
        with:
          title: ${{ inputs.title }}
          content-filepath: ${{ inputs.body }}
          labels: bug
