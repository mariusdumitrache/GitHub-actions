name: DDeploy Java App Workflow

run-name: Run on workflow ${{ github.workflow }}, on branch ${{ github.ref }}, triggered by ${{ github.event_name }}
on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'dev'
jobs:
 deploy-on-dev:
    runs-on: ubuntu-latest
    steps:
    - name: Download artifact
      uses: actions/download-artifact@v4
      with:
        name: demo-app-1.0.0-SNAPSHOT.jar
    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Echo command
      run: echo "Running the application in dev environment"
    - name: run application
      run: java -jar demo-app-1.0.0-SNAPSHOT.jar