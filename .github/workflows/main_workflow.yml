name: Main Workflow

run-name: Run on workflow ${{ github.workflow }}, on branch ${{ github.ref }}, triggered by ${{ github.event_name }}
on:
  push:
    branches: [ "dev" ]
  workflow_dispatch:

permissions:
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven
      - name: Build with Maven
        run: mvn -B package --file pom.xml
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: demo-app-1.0.0-SNAPSHOT.jar
          path: target/*.jar
      - name: Deploy on dev
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh workflow run deploy-java.yml --repo ${{ env.GH_REPO }} --ref dev 